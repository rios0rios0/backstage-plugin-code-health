nodeLinker: 'node-modules'

# Wait a week before resolving newly published versions, so a compromised release
# has time to be caught and unpublished before it reaches this repository.
npmMinimalAgeGate: '7d'

# No `npmAuditIgnoreAdvisories` entries: `yarn npm audit --recursive --severity high`
# is clean on its own. The brace-expansion suppression that used to live here is gone
# because upstream backported the DoS fix to every line in the tree (1.1.18, 2.1.4 and
# 5.0.9, all 2026-07-30), so `resolutions` in `package.json` now pins patched versions
# per line instead of hiding the finding.
