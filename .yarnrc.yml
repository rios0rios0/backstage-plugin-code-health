nodeLinker: 'node-modules'

# Wait a week before resolving newly published versions, so a compromised release
# has time to be caught and unpublished before it reaches this repository.
npmMinimalAgeGate: '7d'

npmAuditIgnoreAdvisories:
  # brace-expansion: DoS via unbounded expansion length.
  # Upstream patched only the 5.x line (5.0.8); the 1.x and 2.x lines that
  # `minimatch@3` and `minimatch@9` depend on have no fixed release. Forcing 5.x
  # onto them breaks at runtime: `minimatch@3` calls the module as a function and
  # `@ts-morph/common`'s `minimatch` calls its default export, neither of which
  # brace-expansion 5 provides. It is a build-time glob dependency that never
  # reaches the published plugin. Drop this once a 1.x/2.x fix ships.
  # Listed by both the npm advisory ID (what `yarn npm audit` matches on) and the
  # GitHub identifier, so the entry stays greppable.
  - '1124334'
  - 'GHSA-mh99-v99m-4gvg'
