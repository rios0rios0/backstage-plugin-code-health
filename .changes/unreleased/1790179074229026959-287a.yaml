kind: 'Added'
body: 'added a role to every person — **engineer** or **lead** — that decides which weights the productivity score is read through: an engineer''s leans on commits, merged pull requests and churn, a lead''s on reviews given and documentation, because a lead is expected to review more than they write, with reliability and the quality of the code touched left where they were and both sets adding up to the same total. Everybody is an engineer until an administrator says otherwise; the role is a column on the Contributors tab and a chip beside the name on a person''s page, and a role assigned to any of somebody''s accounts follows every account of theirs, retroactively across every window ever collected. `ContributorSummary` carries the role as a new required `role` field and `GetAccessResponse` a new required `canManageScoring`; both are *response* shapes — the backend fills them, the browser reads them, and a frontend against an older backend reads the second as false — so every consumer keeps compiling and keeps working, and only something that *constructs* one by hand, such as a test fixture or a stub backend, has to supply the two fields, which is the same shape of change `ownerRef` and `reviews` were'
