body: 'raised `browserslist` to `4.28.8` and `fast-uri` to `3.1.6`, both through `resolutions`, to clear five advisories `sca:yarn-audit` began failing on. `browserslist` was locked at `4.28.6` (GHSA-c83g-rgw3-j3cx, unbounded memory growth via distinct query results; GHSA-73wf-gq98-2v4g, uncaught crash or prototype write via untrusted `browserslist-stats.json`) and `fast-uri` at `3.1.5` (GHSA-5jgf-p345-68v8 host confusion via skipped IDN canonicalisation, GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf server-side request forgery via malformed IPv6 normalisation and repeated hostname percent-decoding). Both reach this workspace transitively, and the existing `fast-uri` resolution pinned `^3.1.4` -- below the `3.1.6` that fixes it. `3.1.7` exists but is a day old and `npmMinimalAgeGate: ''7d''` holds it back, which is the gate working as intended.'
