kind: 'Changed'
body: 'changed the contributors table''s **Lines of Code** column to **Code churn**, which reports the unit the provider actually gave. Azure DevOps reports changed *files* and exposes no line count anywhere in its REST API, so that column showed `0` and `+0 / -0` on every row of an Azure DevOps fleet — which reads as "nobody wrote any code" rather than as "the provider never said". Every row now prints its own unit, and the existing history lights up without re-ingestion because the file counts were already being stored'
