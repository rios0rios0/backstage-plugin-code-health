kind: 'Changed'
body: 'changed the **productivity score** to count the optional integrations when they are configured, with the weights shared over whatever is on. WakaTime adds coding time (a nominal 10%), Jira adds tickets resolved (15%) and tickets that stayed done rather than being reopened (5%), and Confluence adds documentation written — pages created and edited, comments and attachments (10%) — each read as a share of the fleet''s top figure in the same window, the way commits and reviews already are. The eleven nominal weights are renormalised to one over the enabled set, so with every integration on commits carry about 14% instead of 20%, and with none on the score is exactly what it was. An integration that is on but has no account linked to a person leaves its components unmeasured rather than scored as zero, and the Identities tab is where that link is made. `computeProductivityScore` takes the capabilities as a third argument, the backend trend passes the ones it was configured with, and the Productivity column''s header names the components in play'
