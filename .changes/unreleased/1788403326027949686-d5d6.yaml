kind: 'Changed'
body: 'moved the lockfile refresh into this repository''s `.autobump.yaml`. `refresh: true` now sits under `languages.typescript`, beside the `version_files` pattern that makes it necessary: that pattern moves the caret range the frontend and the backend declare on `-common`, and the same string is a resolution descriptor `yarn.lock` keys on, so a bump that moved one without the other desynchronised them and every CI job''s `yarn install --immutable` answered YN0028. AutoBump previously read `refresh` from a project''s own file only when it was `false`, so the flag had to live in each releaser''s `~/.autobump.yaml` -- and when it did not, the release still went out and the lockfile was repaired by hand afterwards, as it was for 2.3.0, 3.0.0 and 4.0.0. It is a fact about this workspace''s build rather than a preference of whoever is releasing, so it now travels with the repository and holds for everyone. Requires AutoBump with project-layer refresh (rios0rios0/autobump#348).'
time: '2026-09-03T02:42:06.027949686Z'
