kind: 'Changed'
body: 'documented the release under AutoBump 3.0.0. Releases are cut with `autobump .` — the `local` subcommand is gone, and the `-c` that used to be mandatory is not, because AutoBump no longer searches the working directory for the operator''s configuration and so can no longer mistake this repository''s `.autobump.yaml` for it. The `yarn.lock` refresh that keeps the bump from tripping YN0028 is now `refresh: true` under `languages.typescript` in the operator''s own configuration, replacing the old `refresh_commands` block — which must be **deleted**, because 3.0.0 recognises the removed key by name and aborts rather than ignoring it. That setting stays the operator''s rather than moving into this repository: AutoBump 3.0.0 owns the command, but whether a package manager runs at all is not something a repository gets to decide, so a project file may switch the refresh off and never on.'
