kind: 'Added'
body: 'added **ownership**: discovery now stores the catalog entity''s `spec.owner` on the repository row (a new `owner_ref` column, migration `20260910000000_owner.js`), normalised as the catalog reads it — a bare name is a group in the default namespace — and the repositories table shows it in an **Owner** column. A contributor''s page lists the repositories they are responsible for, with the health score, quality gate, bugs, coverage, debt, build and compliance of each, worst first: a repository is theirs when its owner is their catalog `User` or a group they belong to, parents included, which is how Backstage itself decides what somebody owns. An account nobody has linked to a catalog `User` owns nothing, and the page says the link is made on the Identities tab. Served by `GET /api/code-health/v1/contributors/:key/repositories`'
