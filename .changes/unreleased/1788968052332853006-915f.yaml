kind: 'Changed'
body: '**BREAKING CHANGE:** changed the pipeline success rate — on the contributors table and on the Insights tile — to divide by the runs that reached a verdict rather than by every run, and added `pipelineRunsFailed` to `ContributorSummary` beside `pipelineRunsSucceeded`. The field is required, so anything that constructs a `ContributorSummary` — a test fixture, a stub backend, a second frontend — has to supply it, which is the same shape of change the `identities` field was. A run cancelled because a newer push superseded it, skipped by a path filter, or still in progress is neither a success nor a failure, and under a workflow that cancels in-progress runs it was most of the denominator, so a busy afternoon read as a bad success rate'
breaking: true
