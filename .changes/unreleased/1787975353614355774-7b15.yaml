kind: 'Changed'
body: 'moved the `yarn.lock` refresh into this repository''s own `.autobump.yaml`. The bump moves the caret range the frontend and the backend declare on `-common`, and that string is a resolution descriptor the lockfile keys on, so without a refresh every CI job''s `yarn install --immutable` answers YN0028 and the release is blocked. That refresh used to have to live in the operator''s `~/.autobump.yaml`, because the old `refresh_commands` key carried an argv — an executable run with the release credentials, which AutoBump could not honour from a repository it had merely discovered. AutoBump 3.0.0 replaced the argv with `refresh: true` and built-in recipes, so the setting now lives in the repository that actually has the problem. Releases are cut with `autobump .`; the `local` subcommand is gone.'
time: '2026-08-29T03:49:13.614288651Z'
