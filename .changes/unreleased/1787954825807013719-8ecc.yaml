kind: 'Added'
body: 'added a Confluence integration that measures documentation work at two levels: per person (pages created, pages edited, versions authored, blog posts, comments, attachments, spaces touched, words written and page views) and per space against the repository whose catalog entity carries the `confluence.io/space-key` annotation (total pages, activity in the window, contributors, last edit, stale pages, the single stalest page and pages with no parent). It runs on the daily snapshot schedule through the shared Atlassian client, so the browser never talks to Atlassian and one API token lights up Jira and Confluence together. Three modelling decisions are worth knowing: written volume is measured in **words**, not lines, because Confluence serves no diff between two versions and no per-edit change size anywhere in its API — the unit rides on the payload the way `ContributorSummary.churnUnit` does, so a run that could not afford to fetch page bodies reports `null` rather than a zero that would read as "this person wrote nothing"; **page views are Confluence Cloud Premium only**, so the first refusal is treated as a verdict about the whole site, views stay `null`, and the dashboard says which of "refused", "not collected" and "measured" happened; and the space report counts **parentless pages** rather than orphan pages, because Confluence Cloud exposes no backlink query at all and half a definition should not be named after the whole of it. Every account seen is reported to the Identities screen by Atlassian `accountId` — the same handle Jira uses — so linking once puts a page, a ticket and a commit on one contributor row. Operator documentation is in `plugins/code-health-backend/docs/confluence.md`.'
