kind: 'Added'
body: 'added Jira delivery metrics at two levels — per person and per repository — collected by a background enricher on the daily snapshot schedule and served to the dashboard, so the browser never talks to Atlassian. Per person: tickets closed and raised, interactions broken into comments, worklog entries and status transitions, story points completed and assigned, average cycle and lead time, and reopened work. Per repository: throughput per week, median and 85th-percentile cycle time, bug ratio, backlog size with the age of its oldest ticket, and the open backlog by priority. Repositories are scoped to a project by a `jira/project-key` annotation and optionally narrowed by `jira/component`, so a repository whose entity names no project has no row rather than a row of zeroes — several repositories legitimately track no work in Jira. A project named by several repositories is queried once and the answer shared, and the fleet aggregates count it once. Story points live on a custom field whose id differs per Jira site, so it is resolved by name at runtime and can be pinned with `codeHealth.atlassian.jira.storyPointsField`; when it cannot be resolved the figures are null and render as an em dash, never as a zero. Cycle time is an average on the contributors table and a median on the repositories table, because identity linking merges a person''s several Atlassian accounts onto one row and medians cannot be combined while totals can. Sprint completion rate is deliberately absent: the public Agile API reports a sprint''s current issues rather than its committed scope, so any figure computed from it would disagree with the sprint report the team is reading'
