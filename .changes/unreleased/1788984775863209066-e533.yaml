kind: 'Added'
body: 'added a **contributor detail page** at `/contributors/person?key=<person key>`, reached by clicking a name in the contributors table or a row of the Top contributors and Review load rankings. It shows the last one to six months of the person''s work as trends — commits and merged pull requests, pull requests opened against merged, reviews given against approved, code churn in the provider''s own unit, pipeline success rate, the quality gate and test coverage of the code they touched, and, when the integrations are configured, coding time and tickets resolved — bucketed by day up to 45 days and by week beyond, and only as far back as the backfill has actually collected. Above the charts sits a **productivity score** (0–100) with its workings: commits 20%, pull requests merged 20%, code churn 10% and reviews given 15%, each read as a share of the fleet''s top figure in the same window so a quiet month for everybody is not everybody''s failure; pipeline success 15%, the quality gate of the code touched 10% and its test coverage against the 80% Sonar gate 10%, all absolute. A component that could not be measured is left out and its weight shared among the rest — no pipeline run is not a bad success rate — and the card says how much of the weight survived. The score is never shown without the components it was built from, because these figures are read as a measure of people, and the contributors table gains a **Productivity** column computed the same way against the window''s fleet. Served by `GET /api/code-health/v1/contributors/:key/trend`; the person travels in the query string rather than the path because an encoded slash in a path segment is decoded before routing'
