kind: 'Fixed'
body: 'fixed merged work being credited to whoever merged it rather than to whoever did it. Both providers stamp the merger on everything a merge produces — the squash commit Azure DevOps authors as whoever pressed *Complete*, the merge commit GitHub authors as the merger and loads with the whole pull request''s diff, and the post-merge pipeline run both report as requested by the merger — so on a team where one or two people complete most pull requests, the contributors table showed them as the authors of everything: the commits, the churn, the pipeline runs, and through those the Sonar bugs and debt of every repository they merged into. `attributeMergedWork` now corrects all of it in one place, fed by both collectors: a squash commit is credited to the pull request''s author; a merge commit is not counted at all, whether a pull request produced it or a `git merge` did, because its diff is the sum of the commits it joins; a rebase is left alone; and a pipeline run belongs to the author of the change it built — the pull request whose merge produced the commit, else the commit''s author, else whoever requested it. The commits a merge commit brought in are fetched from the pull request and stored under the dates they were written, because they never appear in the branch history for the day of the merge and the day they were written was fetched before they were on the branch; without that, dropping the merge commit would make the work vanish from everybody''s row. GitHub reports the parent count on every commit; Azure DevOps reports it on no list endpoint, so a merge commit no pull request names is recognised by the message forms git writes itself, and the pull request''s `completionOptions` decides between a squash, a rebase and a plain merge. The rules are stated in full in `plugins/code-health-backend/docs/attribution.md`'
