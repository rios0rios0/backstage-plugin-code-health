kind: 'Added'
body: 'added an **Identities** tab, and made a contributor row a *person* rather than an account. Every system this plugin measures identifies people differently — a commit-author address or a login, a WakaTime username, an Atlassian account id — and only a shared e-mail joins any two of them on its own. Keyed by account, one human occupied three rows that each held a third of the story. The new screen lists every account the plugin has seen, links it to a catalog `User`, and ranks who else it might be: an identical address, the same local part on a different domain, an identical display name, a username matching the directory address, a partial name match. An address that matches a `User` profile is linked automatically, because that is the same rule the catalog uses; everything weaker is offered and linked only when a person confirms it, because two people who share a surname would silently become one contributor and a merge nobody asked for is far harder to notice than a row that stayed separate. A manual link is never overwritten by the automatic rule. Links are applied when a row is built rather than when a measurement is taken, so correcting one is retroactive across every window ever collected, and an account nobody has linked keeps a row of its own rather than vanishing.


    **BREAKING CHANGE:** `ContributorSummary.key` is now a person key — the catalog `User` reference when linked, `<source>:<sourceKey>` otherwise — where it used to be the bare commit-author identity, and the type carries a new required `identities` field naming what was merged. Anything reading `key` as an e-mail address or a login has to read `identities` instead. The `code_health_contributor_metrics` table is replaced by `code_health_contributor_measures`, keyed by source as well as by day; its rows are dropped rather than migrated, because the WakaTime payload they held has a shape no reader can parse any more and the next snapshot pass rebuilds the whole window anyway'
