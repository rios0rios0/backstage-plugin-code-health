kind: 'Added'
body: 'added the **Productivity score weights** editor to the page header for administrators — every component beside its weight for each role, the share of the score that weight comes to on this install, a restore-defaults per role and one save — with `GET /v1/productivity/weights` answering everybody so the table in the browser and a person''s page on the backend fold the same numbers, and `PUT` / `DELETE /v1/productivity/weights/:role` and `PUT /v1/contributors/:key/role` behind a new `code-health.scoring.manage` permission and the same `codeHealth.administrators` list as the reset, so a policy can hand the reset and the scoring to different people; `GET /v1/access` reports `canManageScoring` beside `canResetIngestion`'
