kind: 'Added'
body: 'added a **repository detail page** at `/repositories/<id>`, reached by clicking a name in the repositories table or a row of the Most active repositories ranking. It shows the last one to six months of the repository as trends — commits and merged pull requests, opened against abandoned, builds succeeded against failed and the success rate, reviews per merged pull request, contributors, bugs and vulnerabilities, code smells, test coverage and duplication, technical debt, compliance checks passing, releases and tags, plus coding time and Jira throughput when those integrations are on — and who worked on it in the window, each name linking to their own page. Above the charts sits a **health score** (0–100) with its workings: quality gate 15%, test coverage against the 80% Sonar gate 15%, bugs and vulnerabilities 10% (a vulnerability counts double, five bug-equivalents halve it), duplication 5% (20% scores nothing), technical debt 5% (five working days halve it), the default branch''s last build 10%, build success over decided builds 10%, branch and build policy 10%, documentation 5%, review coverage 10% and pull requests landed rather than abandoned 5%, with unmeasured components left out rather than scored as zero. Sonar and compliance series move at the daily snapshot''s resolution and start at the first snapshot after installation, which the page says. The repositories table gains a **Health** column computed the same way. Served by `GET /api/code-health/v1/repositories/:id/trend`'
