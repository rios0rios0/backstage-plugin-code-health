kind: 'Added'
body: 'added an administrator-only **Re-collect history** button in the page header, which starts the history collection over the way the merged-work migration did — every commit, pull request, review and pipeline run inside the chosen reach is discarded and re-read from the providers, the dashboards answer for the last day again until the backfill catches up, and everything older than the reach, along with releases, tags, daily snapshots and identity links, is kept. The dialog asks how far back to read — one, two, three, six, nine or twelve months, or everything retained, each shown with its day count and bounded by `codeHealth.ingestion.retentionDays` — so someone who wants last quarter re-read after a fix does not pay for the other three. Who is an administrator is decided by the backend and asked of it before the button is drawn: the caller must be listed in the new `codeHealth.administrators` (catalog user or group references; nobody by default, because Backstage''s stock permission policy allows everything and could not say "administrators only" on its own) and the new `code-health.ingestion.reset` permission must not be denied by an installed permission policy or the RBAC plugin. Served by `GET /api/code-health/v1/access` and `POST /api/code-health/v1/ingestion/reset`'
