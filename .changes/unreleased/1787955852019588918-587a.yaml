kind: 'Changed'
body: 'rewrote the WakaTime integration. It collected two numbers from an endpoint that does not exist — an organisation reached through `/orgs/{org}/members`, where WakaTime actually hangs members off a dashboard — and stored them as one rolling 30-day total, so a range picked over a past month reported the last thirty days relabelled with that month''s dates. It now walks `/users/current/orgs/{org}/dashboards` to its members, addresses each by their member id rather than their username (getting that wrong returns empty summaries for everybody rather than failing), and stores a measurement per day, so the range picker gets a real answer. With no organisation configured it measures the key''s own account, which is what a small team on personal plans wants. The contributors table gains coding time with its daily average, active days as a share of the window, the language somebody spends most time in, branches touched — including ones that produced no commit, which is the difference between this and anything the repository can tell you — and files opened, which stays empty rather than reading zero on the plans WakaTime does not report it on. Repositories gain the coding time logged against their matching WakaTime project, matched by name or by a `wakatime.com/project` annotation, with a repository nothing matched reporting empty rather than zero because "nobody here has WakaTime installed" and "the project is called something else" are different problems. Insights gains a card for where the fleet''s attention went: the categories WakaTime records (coding, debugging, code reviewing, writing tests), the language and editor breakdowns, who spent the most time, and which repositories received it — the only section on that tab that measures effort rather than output, since a version control provider never sees the afternoon that produced no commit'
