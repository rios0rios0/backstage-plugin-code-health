kind: 'Fixed'
body: 'fixed the commits of an Azure DevOps pull request completed with a merge commit being stored with no changed files: neither the pull request''s commit list nor `commitsbatch` reports change counts, so they came back empty. The counts are now read from the commit list at the pull request''s source commit, one request per pull request charged to the run''s budget instead of one `commitsbatch` per hundred commits, and a commit that listing does not reach keeps no count rather than an invented one'
time: '2026-10-08T22:35:40.064396700Z'
