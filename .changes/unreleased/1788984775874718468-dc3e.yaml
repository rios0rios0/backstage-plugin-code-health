kind: 'Changed'
body: 'added two fields to the wire contract: `RepositorySummary.ownerRef` (the catalog owner, or null) and `RepositoryActivity.reviews` (votes cast on the repository''s pull requests by somebody other than their author, so review coverage can be read per repository). Both are *response* shapes — the backend fills them, the browser reads them — so every consumer keeps compiling and keeps working, and `EMPTY_REPOSITORY_ACTIVITY` already carries the new counter. Only something that *constructs* one by hand, such as a test fixture or a stub backend, has to supply the two fields. The common package also gains the score definitions both plugins share (`computeProductivityScore`, `computeRepositoryHealthScore`, `scoreBand`) and the trend, ownership, access and reset response types'
