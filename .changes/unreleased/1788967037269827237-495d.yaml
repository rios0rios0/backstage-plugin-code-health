kind: 'Changed'
body: 'changed the upgrade to re-walk every tracked repository''s history once. The rows stored before the attribution fix credit the merger and cannot be repaired in place, because the facts the fix needs — parent counts, merge commits, the commit a run built — were never stored. The new migration sends each tracked repository''s ingestion cursors back to where a fresh install starts, forgets the days it claimed as fetched, and removes the commits, pull requests, reviews and runs the walk re-collects; releases and tags come from the daily snapshot and stay, and a repository that has left the catalog keeps its history because nothing would ever put it back. The dashboard behaves as it does after installation: the last day is answerable from the first run, and wider ranges unlock as the backfill advances'
