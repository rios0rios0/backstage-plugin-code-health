kind: 'Added'
body: 'added AI authorship and token counts from WakaTime, behind `codeHealth.wakaTime.includeAiMetrics`. This is the only place any system in this plugin can report a token count: WakaTime''s editor plugins observe whether a line was typed or accepted from a completion, and no version control provider knows the difference. The contributors table gains prompt and completion tokens with the split beneath, and the share of added lines attributed to AI with the prompt count beneath; Insights gains both as fleet figures. It is off by default and catches up a few days per run because it is the expensive half — coding time for a whole window costs one request per member, while the AI figures come from the durations resource, which answers for a single day at a time. That means AI history accumulates forwards from the day it was switched on rather than being backfilled, which the documentation says out loud because a chart starting in the middle otherwise reads as a bug. When the resource refuses — a plan that does not serve it, an editor plugin too old to report it — the fields stay null, which says "not collected"; zeros would say nobody used AI, which is a different and false claim'
