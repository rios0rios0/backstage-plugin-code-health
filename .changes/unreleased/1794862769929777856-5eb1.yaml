kind: 'Added'
body: 'added the `code-health/api-exposure` annotation, by which an owner declares with the value `none` that a component exposes no API of its own. A component that runs third-party software serves the API of that vendor rather than one its team defines, yet a `service` with no `spec.providesApis` was graded **Likely** for as long as it existed, and **Undeclared** when the repository kept a copy of the vendor definition; the declaration now grades it **None**, overriding both inferences, while an entity that names an API in `spec.providesApis` stays **Declared** and an archived repository stays **None**. The value is read trimmed and case-insensitively, and any other value is ignored. Discovery stores it in a new `declares_no_api` column on `code_health_repositories`, added with a default of false, so every row already stored keeps its grade until the next discovery pass reads its entity. `ApiExposure` gains a required `declaresNoApi`, which the backend fills, so a frontend against an older backend reads it as absent and shows the usual tooltip; `ApiExposureEvidence` takes it as an optional field that reads as false when absent, so existing callers of `buildApiExposure` and `computeApiExposureState` compile unchanged'
