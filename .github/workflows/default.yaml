name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release
  pull-requests: 'write' # tests-test_all (coverage report comment)
  checks: 'write' # tests-test_all (test results annotations)

jobs:
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/yarn-library.yaml@main'
    with:
      # The shared workflow installs with `--mode=skip-build`, so no dependency's
      # lifecycle script runs as the CI user. This repository is one of the cases that
      # documented escape hatch exists for: the store tests run against a real database
      # through `TestDatabases`, whose default engine is SQLite, and `better-sqlite3` is
      # a native addon that does not exist until its install script compiles or downloads
      # `better_sqlite3.node`. Without this the suite fails on every store test with
      # "Could not locate the bindings file", which is what happened when the shared
      # workflow turned the scripts off on 2026-08-18.
      #
      # Setting it to `true` turns the install into `--mode=skip-build` followed by
      # `yarn rebuild`, so build scripts still never run during resolution — only
      # afterwards, against a lockfile CI has already refused to modify.
      install_run_scripts: true
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  # fourth stage
  # `yarn-library.yaml` stops at cutting the release tag — publishing to a registry
  # is not part of the shared workflow for any language, so it lives here.
  delivery-publish:
    name: 'delivery > publish:npm (${{ matrix.package }})'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      id-token: 'write' # delivery-publish (OIDC trusted publishing + provenance)
    # One job per publishable workspace package. Every package carries the same
    # version and is bumped together, so the tag guard below can compare a single
    # tag against each package.json in turn. `fail-fast: false` keeps one package's
    # failure from cancelling the others mid-release, which would leave the registry
    # holding a partial set.
    strategy:
      fail-fast: false
      matrix:
        package:
          - 'plugins/code-health'
          - 'plugins/code-health-backend'
          - 'plugins/code-health-common'
    # Third-party actions are pinned to a commit SHA rather than a tag: a tag can be
    # silently repointed by its owner, which is how the trivy-action and
    # kics-github-action compromises reached their consumers. Bump the SHA and the
    # trailing version comment together.
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803' # v6.1.0

      - name: 'Enable Corepack'
        run: 'corepack enable'

      # No dependency cache here on purpose, unlike the quality-gate jobs: a poisoned
      # cache entry would be baked straight into the published tarball, and a release
      # build runs rarely enough that the saved minutes are not worth the exposure.
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38' # v6.5.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Node 22 bundles npm 10, but trusted publishing needs 11.5.1 or newer. Pinned
      # for the same reason the actions above are — this is the process that builds,
      # signs and uploads the tarball.
      - name: 'Install a trusted-publishing capable npm'
        run: 'npm install --global npm@11.18.0'
        shell: 'bash'

      - run: |
          yarn install --immutable
          yarn build
        shell: 'bash'

      # Authentication is OIDC trusted publishing: npm exchanges this run's
      # short-lived id-token for a credential scoped to this repository and this
      # workflow file, so there is no npm token in the repository secrets to leak,
      # rotate or expire. That is now the only durable option — classic tokens were
      # revoked in December 2025, granular tokens with write access are capped at 90
      # days, and the 2FA-bypass tokens that CI depends on lose the ability to
      # publish around January 2027.
      #
      # Published with the npm CLI rather than `yarn npm publish` because only the
      # former speaks OIDC and can attach a provenance attestation. `npm publish`
      # runs the package's `prepack`/`postpack` scripts, so `backstage-cli` swaps
      # `package.json` to its `dist/` entry points for the tarball and restores the
      # source ones afterwards.
      - name: 'Publish to npm'
        working-directory: '${{ matrix.package }}'
        run: |
          set -eu

          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"

          # The workflow triggers on every tag, so reaching this step does not mean the
          # tag names a release. `delivery-release` is safe by construction because it
          # derives the version from the tag and skips when it cannot; this job reads
          # the version from package.json instead, so it has to check the pairing
          # explicitly — otherwise pushing an unrelated tag would ship whatever version
          # package.json currently holds. The `v` prefix is optional to match the
          # `tag_prefixes` input of the shared workflow.
          case "${GITHUB_REF:-}" in
            refs/tags/*)
              TAG="${GITHUB_REF#refs/tags/}"
              if [ "${TAG#v}" != "$VERSION" ]; then
                echo "$(date "+%Y-%m-%d %H:%M:%S") - tag $TAG does not name version $VERSION, not publishing..."
                exit 0
              fi
              ;;
          esac

          # The tag path below can re-run for a version that already shipped; npm
          # rejects a duplicate publish, so treat it as a no-op instead of a failure.
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$(date "+%Y-%m-%d %H:%M:%S") - $NAME@$VERSION is already on the registry, skipping..."
            exit 0
          fi

          # Trusted publishing attaches provenance on its own, but asking for it
          # explicitly makes the job fail rather than quietly ship an unattested
          # tarball if the OIDC exchange ever stops being the credential in play.
          echo "$(date "+%Y-%m-%d %H:%M:%S") - publishing $NAME@$VERSION..."
          npm publish --provenance --access public
        shell: 'bash'
    needs: [ 'default' ]
    # Mirrors the `delivery-release` condition in `yarn-library.yaml`, so a version is
    # published exactly when its tag is cut: on a bump merged to main, and on a
    # (re-)pushed version tag so a release whose quality gate failed can be recovered.
    # The two triggers are gated separately on purpose — the main path keeps success()
    # so a failing gate never publishes, while the tag path uses !cancelled() because
    # every job in yarn.yaml skips on refs/tags/*, which makes the `default` need
    # conclude "skipped" and would make an implicit success() skip this job too.
    if: "(success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, 'chore/bump-') || contains(github.event.head_commit.message, 'chore(bump)'))) || (!cancelled() && startsWith(github.ref, 'refs/tags/'))"
